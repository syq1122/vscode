            .rd-Skeleton {
                bottom: 0;
                height: 100%;
                left: 0;
                position: absolute;
                right: 0;
                top: 0;
                width: 100%;
                z-index: 1
            }

            @keyframes rd-skeleton-circle {
                0% {
                    background-position: 100% 50%
                }

                to {
                    background-position: 0 50%
                }
            }

            .rd-Skeleton-animate .rd-Skeleton-item,.rd-Skeleton-animate .rd-Skeleton-item--round:after {
                animation: rd-skeleton-circle 1.5s linear infinite;
                background: linear-gradient(90deg,var(--skeleton-color-bg) 25%,var(--skeleton-color-bg2) 37%,var(--skeleton-color-bg) 63%);
                background-size: 400% 100%
            }

            .rd-Skeleton-item {
                background: var(--skeleton-color-bg);
                /* border-radius: .25rem; */
                position: absolute
            }

            .rd-Skeleton-item--round {
                position: absolute
            }

            .rd-Skeleton-item--round:after {
                background: var(--skeleton-color-bg);
                border-radius: 50%;
                bottom: 0;
                content: "";
                height: 0;
                left: 0;
                margin: auto;
                padding-bottom: 100%;
                position: absolute;
                right: 0;
                top: 0;
                width: 100%
            }

            .rd-Skeleton-item--border {
                border-color: var(--skeleton-color-bg);
                border-style: solid;
                position: absolute
            }

            .rd-Skeleton--dev {
                background: #fff;
                height: 100%;
                left: 0;
                position: absolute;
                top: 0;
                width: 100%;
                z-index: 9999
            }

            .rd-Skeleton-iconBlock {
                align-content: center;
                align-items: center;
                display: inline-flex;
                flex-wrap: wrap;
                height: 100%;
                justify-content: center;
                position: absolute;
                width: 100%
            }

            .rd-Skeleton-iconBlock--auto {
                position: absolute
            }

            .rd-Skeleton-iconBlock--bg {
                background: var(--skeleton-color-bg3);
                border-radius: .25rem
            }

            .rd-Skeleton-iconBlock--chart .rd-Skeleton-iconBlock-icon {
                max-width: 6.25rem;
                width: 19.14%
            }

            .rd-Skeleton-iconBlock-icon {
                max-width: 12.5rem;
                min-width: 2.25rem;
                width: 22.7%
            }

            .rd-Skeleton-iconBlock-text {

            }
